services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21 via Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: reusehub-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static
    name: reusehub-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://reusehub-backend.onrender.com/api/v1

